<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Golku 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(0deg, rgba(255,255,255,0.75), rgba(255,255,255,0.75)),
        repeating-linear-gradient(0deg, #f7dce5 0px, #f7dce5 1px, transparent 1px, transparent 40px),
        repeating-linear-gradient(90deg, #f7dce5 0px, #f7dce5 1px, transparent 1px, transparent 40px);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }

    /* ===== CARD ===== */
    .card {
      background: #fff6df;
      border-radius: 22px;
      padding: 28px 22px 30px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
    }

    .window-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .red { background: #ff9aa2; }
    .yellow { background: #ffe066; }
    .green { background: #9ee6a0; }

    .note {
      font-size: 14px;
      color: #c86b8a;
      margin-bottom: 14px;
      font-weight: 600;
    }

    h1 {
      margin: 10px 0;
      font-size: 26px;
      color: #2b2b2b;
    }

    .desc {
      font-size: 15px;
      color: #555;
      line-height: 1.5;
      margin: 12px 0;
      padding: 0 10px;
    }

    .btn {
      margin-top: 18px;
      background: #e75c96;
      color: #fff;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 999px;
      width: 100%;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(231,92,150,0.35);
      opacity: 0.5;
      pointer-events: none;
    }

    .btn.unlocked {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== BOTTOM SECTION ===== */
    .bottom {
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }

    .host {
      width: 150px;
      animation: fadeInLeft 1s ease forwards;
    }

    .host img {
      width: 100%;
      display: block;
    }

    .countdown-box {
      flex: 1;
      background: #fff;
      border-radius: 18px;
      padding: 16px 14px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
      text-align: center;
    }

    .countdown {
      font-size: 18px;
      font-weight: 700;
      color: #e26d9c;
      line-height: 1.4;
    }

    .footer {
      text-align: center;
      font-size: 13px;
      color: #9a6b7a;
    }

    /* ===== ANIMATION ===== */
    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .calendar-img {
  width: 100%;
  max-width: 260px;
  margin: 0 auto 14px;
  display: block;
  border-radius: 14px;
}
.card {
  position: relative;
}

.corner-gif {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 70px;
  height: auto;
  pointer-events: none;
}
  </style>
</head>

<body>

<div class="page">

  <!-- CARD -->
  <div class="card">
    <img src="cute1.gif" class="corner-gif" alt="cute gif">
    <div class="window-dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>

    <div class="note">A Note for You 💗</div>

    <h1>Hoii Golku! 💕</h1>

    <p class="desc">
      Maine tumhare liye kuch banaya hai,<br>
abhi apne birthday tak wait karo,<br>
tab ye unlock ho jayega 😊<br>
      I wanted to do something special for you,<br>
      so I made something special just for you…
    </p>

   <button class="btn" id="openBtn">
  Open My Heart ✨
</button>
  </div>

  <!-- HOST + COUNTDOWN -->
  <div class="bottom">
    <div class="host">
      <img src="host.png" alt="Host">
    </div>

    <div class="countdown-box">

  <!-- Calendar Image -->
  <img src="calendar.png" class="calendar-img" alt="Calendar">

  <!-- Countdown Text -->
  <div class="countdown" id="countdown">
    Unlocking soon…
  </div>

</div>
  </div>

  <div class="footer">Made with love, only for you 💕</div>

</div>

<script>
  // 🔧 PREVIEW MODE
  const PREVIEW_MODE = true; // true = preview unlock, false = real lock

  // 🎂 11 Feb 2026, 12:00 AM
  const targetDate = new Date("2026-02-11T00:00:00").getTime();

  const btn = document.getElementById("openBtn");
  const countdownEl = document.getElementById("countdown");

  function update() {
    const now = Date.now();
    const diff = targetDate - now;

    // ✅ PREVIEW MODE ON → always unlocked
    if (PREVIEW_MODE) {
      countdownEl.textContent = "It's Time 💖";
      btn.classList.add("unlocked");
      return;
    }

    // ✅ Countdown finished → unlock
    if (diff <= 0) {
      countdownEl.textContent = "It’s time 💖";
      btn.classList.add("unlocked");
      return;
    }

    // ❌ Still locked
    btn.classList.remove("unlocked");

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    countdownEl.textContent =
      `Unlocks in ${d}d ${h}h ${m}m ${s}s`;
  }

  setInterval(update, 1000);
  update();
  btn.addEventListener("click", () => {
  if (btn.classList.contains("unlocked")) {
    window.location.href = "cake.html";
  }
});
</script>

</body>
</html>
